# Reverse proxy for Таро-турагент. Two things here are load-bearing and easy
# to lose in a rewrite: buffering must stay off for the reading page, and the
# share images must be cached here rather than re-rendered per request.

# Docker's embedded DNS, so `app` resolves to all replicas and a restarted
# container is picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# The default `combined` format has no timing and no cache column, which are
# the two questions actually asked of this log: is the app slow, and is the
# image cache working. $request_time is the whole round trip including the
# Tutu search, so a reading legitimately shows ~19s -- watch the static and
# image rows for slowness instead.
log_format tarot '$remote_addr $status $request_time "$request" '
                 'cache=$upstream_cache_status bytes=$body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';

# Rate limiting, and the only part of this file that costs money to omit.
# /api/ritual is an open, unauthenticated POST, and every call spends an
# 18-second Tutu search plus one paid AI request. Without a limit, a loop
# with curl burns the AI budget and risks getting our own Tutu credentials
# throttled.
#
# Keyed per IP, and the rate is deliberately generous: too tight a limit
# locks out everyone behind one corporate NAT -- including the Tutu office,
# which is exactly the audience most likely to arrive all at once. 30/min
# with a burst of 10 lets a person retry, share and reload freely while
# still stopping a script cold. `nodelay` serves the burst immediately
# rather than queueing it, so a real user never feels the limiter.
limit_req_zone $binary_remote_addr zone=ritual:10m rate=30r/m;
# Separate, much larger zone for everything else: pages, art and images are
# cheap, and one person opening a reading pulls a dozen of them at once.
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
# 429 rather than nginx's default 503: this is the client being asked to
# slow down, not the service being unavailable.
limit_req_status 429;

proxy_cache_path /var/cache/nginx/tarot levels=1:2 keys_zone=tarot:16m
                 max_size=1g inactive=30d use_temp_path=off;

# Deliberately NOT an `upstream` block: nginx resolves those once at startup
# and then holds the address forever, so a replica that restarts with a new IP
# would keep getting traffic sent to an address nobody is listening on -- and
# nginx would also refuse to boot at all if the app containers were not up
# yet. Passing the name through a variable forces a DNS lookup per request,
# which Docker's embedded resolver answers with all live replicas.

server {
    listen 80;

    # Inside `server`, not at http level: the base image's nginx.conf already
    # declares an access_log there, and a second one does not replace it --
    # both fire, and every request lands in the log twice. Declared here it
    # overrides the inherited one for this server. (The log_format above must
    # stay at http level; only access_log moves.)
    access_log /var/log/nginx/access.log tarot;

    # Re-resolved on every request thanks to the resolver above.
    set $upstream_app "app:3000";
    server_name _;

    # The card art is ~110KB apiece and the OG images are ~380KB.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Must exceed the search budget (SEARCH_BUDGET_MS = 18s) plus narration,
    # or nginx cuts the connection while the oracle is still speaking.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # NOTE: buffering is left ON here and disabled only for the reading page
    # below. It is tempting to switch it off globally "to be safe" -- that was
    # the first version of this file and it quietly broke image caching, because
    # nginx cannot cache a response it does not buffer. Streaming and caching
    # want opposite things, so each route gets the one it actually needs.

    # ── Share images ─────────────────────────────────────────────────────
    # Both are pure functions of the code in the URL, and both are rendered
    # by Satori -- the only CPU-bound work the app does. Cached here, a link
    # unfurled fifty times in a group chat costs one render instead of fifty.
    location ~ ^/r/[^/]+/(opengraph-image|thumb) {
        proxy_pass http://$upstream_app;
        proxy_cache tarot;
        proxy_cache_valid 200 30d;
        # One render even when fifty requests arrive at once; the rest wait
        # for it rather than each starting their own.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Keep serving the old image if the app is restarting or erroring.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Hashed filenames, safe to cache forever.
    location /_next/static/ {
        proxy_pass http://$upstream_app;
        proxy_cache tarot;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Card art and the logo: same files for everyone, but not hash-named, so
    # a shorter life than the hashed bundles above.
    location ~* \.(webp|png|svg|jpg|jpeg|ico|woff2)$ {
        proxy_pass http://$upstream_app;
        proxy_cache tarot;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Never cached, and never counted as user traffic in the logs.
    location = /healthz {
        proxy_pass http://$upstream_app;
        access_log off;
    }

    # The expensive one: an 18s Tutu search and a paid AI call per request.
    location = /api/ritual {
        limit_req zone=ritual burst=10 nodelay;
        proxy_pass http://$upstream_app;
        proxy_buffering off;
        proxy_cache off;
    }

    # The reading page -- the only route that streams. The cards flush
    # immediately and the road arrives when Tutu answers; buffering here
    # would collapse both halves into one wait of up to 18 seconds.
    location ~ ^/r/[^/]+/?$ {
        # A shared link runs the same live Tutu search as a fresh ritual, so
        # it belongs in the expensive bucket, not the general one.
        limit_req zone=ritual burst=10 nodelay;
        proxy_pass http://$upstream_app;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$upstream_app;
        # Readings must not be cached: the prophecy is frozen in the link but
        # the prices are re-fetched on every open, which is the whole promise.
        proxy_cache off;
    }
}
